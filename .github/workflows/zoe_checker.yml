name: ZOE Outage Monitor

on:
  schedule:
    # Запуск кожні 5 хвилин
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-zoe:
    runs-on: ubuntu-latest

    steps:
      - name: Перевірка коду
        uses: actions/checkout@v3

      - name: Налаштування Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper urllib3

      - name: Відновлення кешу останньої перевірки
        uses: actions/cache@v3
        with:
          path: last_schedule_1_2.txt
          key: zoe-schedule-cache-${{ github.run_id }}
          restore-keys: |
            zoe-schedule-cache-

      - name: Запуск парсера
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UKRAINE_PROXY: ${{ secrets.UKRAINE_PROXY }}
        run: python BotCherga1_2.py

      - name: Збереження кешу для наступного запуску
        uses: actions/cache@v3
        with:
          path: last_schedule_1_2.txt
          key: zoe-schedule-cache-${{ github.run_id }}
